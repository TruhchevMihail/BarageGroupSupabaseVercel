{% extends 'base.html' %}
{% block content %}
<div class="page-head split">
  <div>
    <span class="eyebrow">Профил</span>
    <h1>Нова парола</h1>
  </div>
  <a href="{{ back_url }}" class="btn-secondary">Назад</a>
</div>

<form method="post" class="panel form-sheet user-edit-form operational-form form-section">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="uef-grid">
    <div class="uef-left uef-equal">
      <div class="form-card form-section">
        <div class="section-head"><h2>Сигурност</h2></div>
        {% if require_current_password %}
        <label>
          <span class="field-label-row"><span class="field-label-text">Текуща парола</span><span class="required-mark">*</span></span>
          <input type="password" name="current_password" required maxlength="128" autocomplete="current-password">
        </label>
        {% endif %}

        <label>
          <span class="field-label-row"><span class="field-label-text">Нова парола</span><span class="required-mark">*</span></span>
          <input type="password" name="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="Минимум 8 символа">
        </label>

        <label>
          <span class="field-label-row"><span class="field-label-text">Потвърди парола</span><span class="required-mark">*</span></span>
          <input type="password" name="password_confirm" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="Повторете паролата">
        </label>
      </div>
    </div>
  </div>

  <div class="form-actions sticky-page-actions">
    <button type="submit">Запази</button>
    <a href="{{ back_url }}" class="btn-secondary">Отказ</a>
  </div>
</form>
{% endblock %}
