{% extends 'base.html' %}
{% block content %}
<div class="page-head split">
  <div>
    <span class="eyebrow">Машини и инструменти</span>
    <h1>{{ 'Добавяне на сервизен запис' if is_new else 'Редакция на сервизен запис' }}</h1>
  </div>
  <a href="{{ url_for('asset_detail', asset_id=asset.id) }}" class="btn-secondary">Назад</a>
</div>

<section class="panel">
  <form method="post" enctype="multipart/form-data" class="form-card compact">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Дата
      <input type="date" name="service_date" value="{{ record.service_date.strftime('%Y-%m-%d') if record and record.service_date else today }}">
    </label>
    <label>Проблем
      <input name="problem" required value="{{ record.problem if record else '' }}">
    </label>
    <label>Извършено действие
      <textarea name="action_taken" required>{{ record.action_taken if record else '' }}</textarea>
    </label>
    <label>Сервиз / изпълнител
      <input name="service_provider" value="{{ record.service_provider if record else '' }}">
    </label>
    <label>Фактура като снимка
      <input type="file" name="invoice_image" accept="image/*">
    </label>
    <label>Цена с ДДС (€)
      <input type="number" step="0.01" min="0" name="price" placeholder="0.00" value="{{ record.price if record and record.price is not none else 0 }}">
    </label>
    <label>Забележки
      <textarea name="notes">{{ strip_service_invoice_marker(record.notes) if record and record.notes else '' }}</textarea>
    </label>
    <button type="submit">{{ 'Запази' if not is_new else 'Добави' }}</button>
  </form>
</section>
{% endblock %}
